[project]
name = "keyholder"
version = "1.0.0"
description = "Toggle keyboard keys into a simulated held state via a Tkinter UI, using the Win32 SendInput API."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyinstaller"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
